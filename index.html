<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Dia C</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        tr:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>

    <h1>Dashboard Dia C</h1>

    <table>

        <thead>

            <tr>
                <th>Data</th>
                <th>Parceira</th>
                <th>Equipes Mobilizadas</th>
                <th>Programações Executadas</th>
                <th>Ligações Executadas</th>
            </tr>

        </thead>

        <tbody id="tabelaDados">
        </tbody>

    </table>

    <script>

        fetch('./dados.json')

            .then(response => {

                if (!response.ok) {
                    throw new Error("Erro ao carregar dados.json");
                }

                return response.json();

            })

            .then(dados => {

                const tabela = document.getElementById("tabelaDados");

                dados.forEach(item => {

                    const linha = document.createElement("tr");

                    linha.innerHTML = `
                        <td>${item.DATA}</td>
                        <td>${item.PARCEIRA}</td>
                        <td>${item.EQUIPES_MOBILIZADAS}</td>
                        <td>${item.PROGRAMACOES_EXECUTADAS}</td>
                        <td>${item.LIGACOES_EXECUTADAS}</td>
                    `;

                    tabela.appendChild(linha);

                });

            })

            .catch(error => {

                console.error("Erro:", error);

            });

    </script>

</body>

</html>
