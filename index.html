<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Painel de Acompanhamento</title>

    <link rel="stylesheet" href="./css/painel-base.css">

    <script src="./js/painel-config.js" defer></script>
    <script src="./js/painel-base.js" defer></script>

    <!-- Bibliotecas compartilhadas pelas visões que utilizam gráficos -->
    <script src="./js/chart.umd.min.js" defer></script>
    <script src="./js/chartjs-plugin-datalabels.min.js" defer></script>

    <script src="./js/painel-player.js" defer></script>
</head>

<body>
<div id="stage">

    <!-- Cabeçalho único do PG-V2. O módulo ativo atualiza os textos. -->
    <header class="topo">
        <div class="topo-identidade">
            <img
                class="logo-equatorial"
                src="./img/logo-equatorial.svg"
                alt="Grupo Equatorial Energia"
            >

            <div class="separador-marca"></div>

            <div class="titulo-bloco">
                <h1 id="tituloPrincipal" class="titulo-principal">
                    Painel de Acompanhamento
                </h1>

                <div id="subtituloPrincipal" class="subtitulo-principal">
                    Carregando visão...
                </div>
            </div>
        </div>

        <div class="topo-centro">
            <div class="visao-indicador">
                <span class="visao-indicador-label">Visão atual</span>
                <span id="nomeVisaoHeader" class="visao-indicador-nome">
                    CARREGANDO
                </span>
            </div>
        </div>

        <div class="topo-rotacao">
            <div id="contador" class="proxima-visao">
                Preparando apresentação...
            </div>

            <div class="barra-tempo">
                <div id="barraTempo" class="barra-tempo-preenchimento"></div>
            </div>
        </div>
    </header>

    <!-- Fragmentos das visões são injetados aqui. -->
    <div id="conteudoVisao" class="conteudo-visao-shell" aria-live="polite"></div>

    <div id="erroPlayer" class="erro-player" role="status" aria-live="polite"></div>

</div>
</body>
</html>
