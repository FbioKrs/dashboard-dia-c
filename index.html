<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Dia C</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 30px;
        }


        /* =====================================================
           CABEÇALHO
        ===================================================== */

        .header {
            margin-bottom: 30px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin: 5px 0 0;
            color: #666;
        }

        .status {
            font-size: 12px;
            color: #777;
            white-space: nowrap;
            padding-top: 8px;
        }


        /* =====================================================
           CARDS
        ===================================================== */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 38px;
            font-weight: bold;
            margin-top: 10px;
        }


        /* =====================================================
           PAINÉIS
        ===================================================== */

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }

        .panel h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
        }


        /* =====================================================
           ÁREA DOS GRÁFICOS
        ===================================================== */

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-grid .panel {
            margin-bottom: 0;
        }

        .chart-container {
            position: relative;
            height: 380px;
        }


        /* =====================================================
           TABELA
        ===================================================== */

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #333;
            color: white;
            padding: 12px;
            font-size: 13px;
            text-align: center;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #f7f7f7;
        }


        /* =====================================================
           RESPONSIVIDADE
        ===================================================== */

        @media (max-width: 900px) {

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .header-top {
                flex-direction: column;
            }

            .status {
                padding-top: 0;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <div class="header">

        <div class="header-top">

            <div>

                <h1>Dia C</h1>

                <p>
                    Acompanhamento das execuções
                </p>

            </div>


            <div
                class="status"
                id="status">

                Carregando dados...

            </div>

        </div>

    </div>


    <!-- =====================================================
         INDICADORES
    ====================================================== -->

    <div class="cards">


        <!-- EQUIPES -->

        <div class="card">

            <div class="card-title">
                Equipes Mobilizadas
            </div>

            <div
                class="card-value"
                id="totalEquipes">

                -

            </div>

        </div>


        <!-- PROGRAMAÇÕES -->

        <div class="card">

            <div class="card-title">
                Programações Executadas
            </div>

            <div
                class="card-value"
                id="totalProgramacoes">

                -

            </div>

        </div>


        <!-- LIGAÇÕES -->

        <div class="card">

            <div class="card-title">
                Ligações Executadas
            </div>

            <div
                class="card-value"
                id="totalLigacoes">

                -

            </div>

        </div>


    </div>


    <!-- =====================================================
         GRÁFICOS
    ====================================================== -->

    <div class="dashboard-grid">


        <!-- EVOLUÇÃO -->

        <div class="panel">

            <h2>
                Evolução das Execuções
            </h2>

            <div class="chart-container">

                <canvas
                    id="graficoEvolucao">
                </canvas>

            </div>

        </div>


        <!-- PARCEIRAS -->

        <div class="panel">

            <h2>
                Execuções por Parceira
            </h2>

            <div class="chart-container">

                <canvas
                    id="graficoParceiras">
                </canvas>

            </div>

        </div>


    </div>


    <!-- =====================================================
         DETALHAMENTO
    ====================================================== -->

    <div class="panel">

        <h2>
            Detalhamento
        </h2>


        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Data
                        </th>

                        <th>
                            Parceira
                        </th>

                        <th>
                            Equipes Mobilizadas
                        </th>

                        <th>
                            Programações Executadas
                        </th>

                        <th>
                            Ligações Executadas
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="tabelaDados">
                </tbody>

            </table>

        </div>

    </div>


</div>


<script>


/* =========================================================
   VARIÁVEIS DOS GRÁFICOS
========================================================= */

let grafico;
let graficoParceiras;


/* =========================================================
   CONVERSÃO DE NÚMEROS
========================================================= */

function numero(valor) {

    if (
        valor === null ||
        valor === undefined ||
        valor === ""
    ) {

        return 0;

    }


    return Number(

        String(valor)

            .replace(/\./g, "")

            .replace(",", ".")

    ) || 0;

}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados() {

    try {


        /*
        O timestamp evita que o navegador utilize
        uma versão antiga do dados.json.
        */

        const response = await fetch(

            "./dados.json?t=" +
            new Date().getTime()

        );


        if (!response.ok) {

            throw new Error(
                "Não foi possível carregar dados.json"
            );

        }


        const dados =
            await response.json();


        /* Atualizar componentes */

        atualizarCards(dados);

        atualizarTabela(dados);

        atualizarGrafico(dados);

        atualizarGraficoParceiras(dados);


        /* Horário da atualização */

        const agora =
            new Date();


        document
            .getElementById("status")
            .textContent =

            "Última atualização: " +

            agora.toLocaleTimeString(
                "pt-BR"
            );


    }

    catch (erro) {


        console.error(erro);


        document
            .getElementById("status")
            .textContent =

            "Erro ao carregar os dados";


    }

}


/* =========================================================
   CARDS
========================================================= */

function atualizarCards(dados) {


    let equipes = 0;

    let programacoes = 0;

    let ligacoes = 0;


    dados.forEach(item => {


        equipes += numero(
            item.EQUIPES_MOBILIZADAS
        );


        programacoes += numero(
            item.PROGRAMACOES_EXECUTADAS
        );


        ligacoes += numero(
            item.LIGACOES_EXECUTADAS
        );


    });


    document
        .getElementById("totalEquipes")
        .textContent =

        equipes.toLocaleString(
            "pt-BR"
        );


    document
        .getElementById("totalProgramacoes")
        .textContent =

        programacoes.toLocaleString(
            "pt-BR"
        );


    document
        .getElementById("totalLigacoes")
        .textContent =

        ligacoes.toLocaleString(
            "pt-BR"
        );

}


/* =========================================================
   TABELA
========================================================= */

function atualizarTabela(dados) {


    const tabela =

        document.getElementById(
            "tabelaDados"
        );


    tabela.innerHTML = "";


    dados.forEach(item => {


        const linha =
            document.createElement("tr");


        linha.innerHTML = `

            <td>
                ${item.DATA}
            </td>

            <td>
                ${item.PARCEIRA}
            </td>

            <td>
                ${numero(
                    item.EQUIPES_MOBILIZADAS
                )}
            </td>

            <td>
                ${numero(
                    item.PROGRAMACOES_EXECUTADAS
                )}
            </td>

            <td>
                ${numero(
                    item.LIGACOES_EXECUTADAS
                )}
            </td>

        `;


        tabela.appendChild(
            linha
        );

    });

}


/* =========================================================
   GRÁFICO DE EVOLUÇÃO
========================================================= */

function atualizarGrafico(dados) {


    const labels =

        dados.map(
            item => item.DATA
        );


    const equipes =

        dados.map(
            item =>
                numero(
                    item.EQUIPES_MOBILIZADAS
                )
        );


    const programacoes =

        dados.map(
            item =>
                numero(
                    item.PROGRAMACOES_EXECUTADAS
                )
        );


    const ligacoes =

        dados.map(
            item =>
                numero(
                    item.LIGACOES_EXECUTADAS
                )
        );


    const contexto =

        document

            .getElementById(
                "graficoEvolucao"
            )

            .getContext("2d");


    if (grafico) {

        grafico.destroy();

    }


    grafico = new Chart(

        contexto,

        {

            type: "bar",


            data: {

                labels: labels,


                datasets: [

                    {

                        label:
                            "Equipes Mobilizadas",

                        data:
                            equipes

                    },

                    {

                        label:
                            "Programações Executadas",

                        data:
                            programacoes

                    },

                    {

                        label:
                            "Ligações Executadas",

                        data:
                            ligacoes

                    }

                ]

            },


            options: {


                responsive: true,


                maintainAspectRatio:
                    false,


                interaction: {

                    mode: "index",

                    intersect: false

                },


                plugins: {

                    legend: {

                        position:
                            "top"

                    }

                },


                scales: {

                    y: {

                        beginAtZero:
                            true,

                        ticks: {

                            precision:
                                0

                        }

                    }

                }

            }

        }

    );

}


/* =========================================================
   GRÁFICO POR PARCEIRA
========================================================= */

function atualizarGraficoParceiras(dados) {


    const parceiras = {};


    /*
    Agrupa automaticamente os dados por parceira.
    Não é necessário escrever DPL, CENA etc.
    */


    dados.forEach(item => {


        const nome =

            item.PARCEIRA ||
            "Não informado";


        if (!parceiras[nome]) {


            parceiras[nome] = {

                equipes: 0,

                programacoes: 0,

                ligacoes: 0

            };

        }


        parceiras[nome].equipes +=

            numero(
                item.EQUIPES_MOBILIZADAS
            );


        parceiras[nome].programacoes +=

            numero(
                item.PROGRAMACOES_EXECUTADAS
            );


        parceiras[nome].ligacoes +=

            numero(
                item.LIGACOES_EXECUTADAS
            );


    });


    const nomes =

        Object.keys(
            parceiras
        );


    const equipes =

        nomes.map(

            nome =>
                parceiras[nome]
                    .equipes

        );


    const programacoes =

        nomes.map(

            nome =>
                parceiras[nome]
                    .programacoes

        );


    const ligacoes =

        nomes.map(

            nome =>
                parceiras[nome]
                    .ligacoes

        );


    const contexto =

        document

            .getElementById(
                "graficoParceiras"
            )

            .getContext("2d");


    if (graficoParceiras) {

        graficoParceiras.destroy();

    }


    graficoParceiras = new Chart(

        contexto,

        {

            type: "bar",


            data: {

                labels:
                    nomes,


                datasets: [

                    {

                        label:
                            "Equipes",

                        data:
                            equipes

                    },

                    {

                        label:
                            "Programações",

                        data:
                            programacoes

                    },

                    {

                        label:
                            "Ligações",

                        data:
                            ligacoes

                    }

                ]

            },


            options: {


                indexAxis:
                    "y",


                responsive:
                    true,


                maintainAspectRatio:
                    false,


                interaction: {

                    mode:
                        "index",

                    intersect:
                        false

                },


                plugins: {

                    legend: {

                        position:
                            "top"

                    }

                },


                scales: {

                    x: {

                        beginAtZero:
                            true,

                        ticks: {

                            precision:
                                0

                        }

                    }

                }

            }

        }

    );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */


/*
Carrega os dados imediatamente
quando a página é aberta.
*/

carregarDados();


/*
Depois consulta novamente o dados.json
a cada 60 segundos.

Não é necessário atualizar
a página inteira.
*/

setInterval(

    () => {

        carregarDados();

    },

    60000

);


</script>

</body>

</html>
